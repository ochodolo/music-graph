[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mgraph"
version = "0.1.0"
description = "Surface lesser-known artists via the music collaboration graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
